<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Translator - Real-time Translation</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}?v=13">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Premium Ambient Glow Effects -->
    <div class="ambient-glow blob-1"></div>
    <div class="ambient-glow blob-2"></div>
    <div class="ambient-glow blob-3"></div>

    <main class="container">
        <!-- Header -->
        <header>
            <h1>
                <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
                    <path d="M12 2a10 10 0 0 1 10 10H12V2z" opacity="0.6"></path>
                    <path d="M12 12L2.7 7.2" opacity="0.8"></path>
                    <path d="M12 12l9.3 4.8" opacity="0.8"></path>
                    <path d="M20 7h-9"></path>
                    <path d="M14 4l-3 3 3 3"></path>
                </svg>
                <span>GURU'S Translator</span>
            </h1>
            <p class="subtitle">
                Experience seamless, real-time AI-powered translation across English, Tamil, Hindi, and more.
            </p>
            <div class="session-actions">
                <button class="logout-btn" id="logoutBtn" type="button" aria-label="Logout">
                    <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                        <polyline points="16 17 21 12 16 7"></polyline>
                        <line x1="21" y1="12" x2="9" y2="12"></line>
                    </svg>
                    <span>Logout</span>
                </button>
            </div>
        </header>

        <!-- Language Selection Bar -->
        <div class="lang-bar">
            <div class="lang-container" aria-label="Language selection">
                <!-- Keep hidden native select fields to handle script.js binding -->
                <select id="sourceLang" aria-label="Select source language" style="display: none;"></select>

                <!-- Custom Source Select -->
                <div class="custom-select" id="customSourceLang">
                    <button class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" id="customSourceLangTrigger">
                        <span class="lang-badge">EN</span>
                        <span class="selected-value">English</span>
                        <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div class="custom-select-dropdown">
                        <div class="search-box-container">
                            <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" class="lang-search-input" placeholder="Search..." aria-label="Search language">
                        </div>
                        <ul class="custom-options-list" role="listbox" id="customSourceOptions">
                            <!-- Populated by JS -->
                        </ul>
                    </div>
                </div>

                <button class="swap-btn" type="button" onclick="swapLanguages()" aria-label="Swap languages" title="Swap languages">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 3L21 8L16 13"></path>
                        <path d="M21 8H9"></path>
                        <path d="M8 21L3 16L8 11"></path>
                        <path d="M3 16H15"></path>
                    </svg>
                </button>

                <select id="targetLang" aria-label="Select target language" style="display: none;"></select>

                <!-- Custom Target Select -->
                <div class="custom-select" id="customTargetLang">
                    <button class="custom-select-trigger" type="button" aria-haspopup="listbox" aria-expanded="false" id="customTargetLangTrigger">
                        <span class="lang-badge">TA</span>
                        <span class="selected-value">Tamil</span>
                        <svg class="chevron-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
                    </button>
                    <div class="custom-select-dropdown">
                        <div class="search-box-container">
                            <svg class="search-icon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                            <input type="text" class="lang-search-input" placeholder="Search..." aria-label="Search language">
                        </div>
                        <ul class="custom-options-list" role="listbox" id="customTargetOptions">
                            <!-- Populated by JS -->
                        </ul>
                    </div>
                </div>
            </div>
        </div>

        <!-- Translator Grid (Dual Panel) -->
        <div class="translator-grid">
            <!-- Left Card: Input -->
            <div class="glass-panel input-panel">
                <div class="panel-header">
                    <span class="panel-label">Source Text</span>
                    <span class="char-count" id="charCount">0 / 5000</span>
                </div>
                <div class="textarea-container">
                    <textarea id="inputText" placeholder="Enter text to translate..." aria-label="Text to translate"></textarea>

                    <div class="panel-actions-left">
                        <button class="action-btn clear-btn" type="button" onclick="clearText()" aria-label="Clear text" title="Clear text">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="18" y1="6" x2="6" y2="18"></line>
                                <line x1="6" y1="6" x2="18" y2="18"></line>
                            </svg>
                        </button>
                    </div>

                    <!-- Voice wave visualization when recording is active -->
                    <div class="voice-wave-container" id="voiceWave">
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                        <div class="wave-bar"></div>
                    </div>

                    <div class="panel-actions-right">
                        <button class="action-btn voice-btn input-voice-btn" type="button" onclick="speakInputText()" aria-label="Listen to input text" title="Listen">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                        </button>

                        <button class="action-btn record-btn" id="recordBtn" type="button" onclick="toggleVoiceTyping()" aria-label="Record voice to text" title="Voice input">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="23"></line>
                                <line x1="8" y1="23" x2="16" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <!-- Suggestion Box inside the input panel context -->
                <div class="suggestion-box hidden" id="suggestionBox" aria-live="polite">
                    <svg class="suggestion-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"></circle>
                        <line x1="12" y1="16" x2="12" y2="12"></line>
                        <line x1="12" y1="8" x2="12.01" y2="8"></line>
                    </svg>
                    <span>Did you mean <button type="button" id="suggestionText"></button>?</span>
                </div>
            </div>

            <!-- Right Card: Output -->
            <div class="glass-panel output-panel">
                <div class="panel-header">
                    <span class="panel-label">Translation Result</span>
                </div>
                <div class="result-container empty" id="resultContainer">
                    <div id="result">Your translation will appear here...</div>

                    <div class="panel-actions-right">
                        <button class="action-btn copy-btn" type="button" onclick="copyResult()" aria-label="Copy translation" title="Copy to clipboard">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                            </svg>
                        </button>

                        <button class="action-btn voice-btn output-voice-btn" id="outputVoiceBtn" type="button" onclick="speakResult()" aria-label="Listen to translation" title="Listen to translation">
                            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                                <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Translate Button Action Footer -->
        <div class="actions-footer">
            <button class="translate-btn" id="translateBtn" type="button" onclick="translateText()">
                <span id="btnText">Translate Text</span>
            </button>
        </div>
    </main>

    <!-- Toast Notification -->
    <div class="toast" id="toast"></div>

    <script src="{% static 'js/script.js' %}?v=12"></script>
</body>

</html>
