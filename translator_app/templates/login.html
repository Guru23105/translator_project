<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Translator System</title>

    {% load static %}
    <link rel="stylesheet" href="{% static 'css/auth.css' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body class="auth-page">
    <main class="auth-shell">
        <section class="login-card" aria-labelledby="loginTitle">
            <div class="brand-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M12 2a10 10 0 1 0 10 10H12V2z"></path>
                    <path d="M12 2a10 10 0 0 1 10 10H12V2z" opacity="0.65"></path>
                    <path d="M20 7h-9"></path>
                    <path d="M14 4l-3 3 3 3"></path>
                </svg>
            </div>

            <div class="login-heading">
                <p class="eyebrow">AI Translator System</p>
                <h1 id="loginTitle">Welcome back</h1>
                <p class="login-subtitle">Sign in with your username and password to continue.</p>
            </div>

            <form id="loginForm" class="login-form" novalidate>
                <div class="field-group">
                    <label for="username">Username</label>
                    <input id="username" name="username" type="text" autocomplete="username" placeholder="Enter username" required>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <input id="password" name="password" type="password" autocomplete="current-password" placeholder="Enter password" required>
                </div>

                <div id="loginError" class="auth-error" role="alert" aria-live="polite"></div>

                <button id="loginButton" class="login-button" type="submit">
                    <span>Login</span>
                </button>
            </form>
        </section>
    </main>

    <script src="{% static 'js/auth.js' %}?v=1"></script>
</body>

</html>
